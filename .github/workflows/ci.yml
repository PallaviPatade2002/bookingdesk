name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Backend tests
        run: cd backend && npm ci && npm test
      - name: Frontend build
        run: cd frontend && npm ci && npm run build
